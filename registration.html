<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyHaven Airlines | Passenger Registration</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="registration.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html" class="logo">Sky<span>Haven</span></a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
      <ul id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="registration.html" class="active">Passenger Registration</a></li>
        <li><a href="reservation.html">Flight Reservation</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-title"><h1>Passenger Registration</h1></div>

  <section class="bg-light">
    <div class="container">
      <form class="form-box" id="registrationForm">
        <div class="form-row">
          <div class="field"><label for="firstName">First Name</label><input type="text" id="firstName" name="firstName" required></div>
          <div class="field"><label for="lastName">Last Name</label><input type="text" id="lastName" name="lastName" required></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
          <div class="field"><label for="phone">Phone Number</label><input type="tel" id="phone" name="phone" pattern="[0-9+\- ]{7,15}" placeholder="09XXXXXXXXX" required></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="birthdate">Birthdate</label><input type="date" id="birthdate" name="birthdate" required></div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label for="nationality">Nationality</label><input type="text" id="nationality" name="nationality" value="Filipino" required></div>
          <div class="field"><label for="passportNo">Passport / ID Number</label><input type="text" id="passportNo" name="passportNo" required></div>
        </div>
        <button type="submit" class="btn">Register</button>
        <div class="message"></div>
      </form>
    </div>
  </section>

  <footer>&copy; <span id="year"></span> SkyHaven Airlines. All rights reserved.</footer>
  <script src="script.js"></script>
</body>
</html>
